<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微 · 文档导入</title>
    <style>
        :root{
            --paper:#f7f5ef;
            --surface:#ffffff;
            --ink:#25313a;
            --muted:#8a939e;
            --brand:#17635c;
            --brand-deep:#0f4a45;
            --brand-soft:#e7f0ee;
            --seal:#c0564b;
            --border:#e6e1d6;
            --border-soft:#efebe2;
            --green:#3d8b6e;
            --amber:#b8862f;
            --red:#c0564b;
            --shadow:0 12px 32px -14px rgba(31, 45, 40, .18);
            --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
            --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            padding:0;
            font-family:var(--sans);
            background-color:var(--paper);
            background-image:
                radial-gradient(ellipse 60% 30% at 50% -5%, rgba(23, 99, 92, .07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 25% at 95% 100%, rgba(192, 86, 75, .04) 0%, transparent 70%);
            color:var(--ink);
            min-height:100vh;
        }

        /* ============ 顶栏（与问答页一致） ============ */
        .topbar{
            max-width:860px;
            margin:0 auto;
            display:flex;
            align-items:center;
            gap:12px;
            padding:22px 24px 10px;
        }
        .brand{display:flex;align-items:center;gap:12px}
        .logo{
            width:42px;height:42px;border-radius:10px;
            background:linear-gradient(160deg, var(--brand), var(--brand-deep));
            color:#f2efe6;
            font-family:var(--serif);
            font-size:17px;font-weight:700;
            display:flex;align-items:center;justify-content:center;
            letter-spacing:1px;
            box-shadow:0 6px 16px -6px rgba(15, 74, 69, .45);
            position:relative;
            flex:0 0 auto;
        }
        .logo::after{
            content:"";
            position:absolute;right:-3px;bottom:-3px;
            width:10px;height:10px;border-radius:3px;
            background:var(--seal);
            border:2px solid var(--paper);
        }
        .title{display:flex;flex-direction:column;line-height:1.25}
        .title strong{font-size:19px;font-family:var(--serif);letter-spacing:2px}
        .title span{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:1px}
        .top-actions{margin-left:auto}
        .link-btn{
            font-size:13px;color:var(--brand);text-decoration:none;
            border:1px solid rgba(23,99,92,.25);background:var(--surface);
            padding:7px 14px;border-radius:8px;transition:all .2s;
        }
        .link-btn:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(23,99,92,.12)}

        .container{
            width:100%;
            max-width:860px;
            margin:0 auto;
            padding:14px 24px 48px;
        }

        /* ============ 上传区 ============ */
        .upload-area{
            border:1.5px dashed rgba(23, 99, 92, .35);
            background:var(--surface);
            border-radius:16px;
            padding:48px 32px;
            text-align:center;
            cursor:pointer;
            transition:all .25s ease;
            margin-bottom:12px;
            box-shadow:var(--shadow);
        }
        .upload-area:hover,.upload-area.dragover{
            border-color:var(--brand);
            background:linear-gradient(180deg, #fff, var(--brand-soft));
            transform:translateY(-2px);
        }
        .upload-icon{
            width:56px;height:56px;margin:0 auto 16px;
            border-radius:14px;
            background:var(--brand-soft);
            display:flex;align-items:center;justify-content:center;
        }
        .upload-icon svg{width:26px;height:26px;stroke:var(--brand)}
        .upload-text{
            color:var(--ink);
            font-size:15px;font-weight:600;
            margin-bottom:6px;
        }
        .upload-sub{
            color:var(--muted);font-size:12.5px;
            display:flex;align-items:center;justify-content:center;gap:8px;
        }
        .fmt{
            display:inline-block;
            font-size:11px;color:var(--brand);
            border:1px solid rgba(23,99,92,.2);background:var(--brand-soft);
            padding:2px 10px;border-radius:999px;letter-spacing:.5px;
        }
        .file-input{display:none}

        /* ============ 文件列表 ============ */
        .file-list{
            margin-top:24px;
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .file-item{
            background:var(--surface);
            border:1px solid var(--border-soft);
            border-radius:14px;
            padding:18px 20px;
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:16px;
            transition:transform .2s ease, box-shadow .2s ease;
            box-shadow:0 4px 14px -8px rgba(31, 45, 40, .12);
        }
        .file-item:hover{
            transform:translateY(-2px);
            box-shadow:var(--shadow);
        }
        .file-info{
            display:flex;
            flex-direction:column;
            flex:1;
            min-width:0;
        }
        .file-header{
            display:flex;
            align-items:baseline;
            gap:10px;
            margin-bottom:10px;
        }
        .file-name{
            font-weight:600;
            color:var(--ink);
            font-size:14.5px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        }
        .file-size{
            font-size:12px;
            color:var(--muted);
            flex-shrink:0;
        }
        .status-badge{
            padding:6px 14px;
            border-radius:999px;
            font-size:12.5px;
            font-weight:600;
            min-width:76px;
            text-align:center;
            letter-spacing:.5px;
            flex-shrink:0;
            align-self:center;
        }
        .status-uploading{background:rgba(184,134,47,.1);color:var(--amber);border:1px solid rgba(184,134,47,.3)}
        .status-processing{background:rgba(23,99,92,.08);color:var(--brand);border:1px solid rgba(23,99,92,.25)}
        .status-completed{background:rgba(61,139,110,.1);color:var(--green);border:1px solid rgba(61,139,110,.3)}
        .status-error{background:rgba(192,86,75,.08);color:var(--red);border:1px solid rgba(192,86,75,.3)}

        /* 进度条 */
        .progress-wrapper{margin-top:6px;display:none}
        .progress-bar-container{
            width:100%;
            height:6px;
            background-color:#eceae2;
            border-radius:3px;
            overflow:hidden;
        }
        .progress-bar{
            height:100%;
            width:0%;
            border-radius:3px;
            transition:width .4s cubic-bezier(0.4, 0, 0.2, 1), background-color .4s;
            position:relative;
            overflow:hidden;
        }
        .progress-bar::after{
            content:"";
            position:absolute;top:0;left:0;bottom:0;right:0;
            background:linear-gradient(90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,.35) 50%,
                rgba(255,255,255,0) 100%);
            animation:shimmer 2s infinite;
        }
        @keyframes shimmer{
            0%{transform:translateX(-100%)}
            100%{transform:translateX(100%)}
        }
        .progress-text{
            font-size:12px;
            color:var(--muted);
            margin-top:6px;
            text-align:right;
            font-variant-numeric:tabular-nums;
        }

        /* 运行日志时间线 */
        .log-details{
            margin-top:12px;
            font-size:13px;
            color:var(--ink);
            background:#fbfaf6;
            border-radius:12px;
            padding:12px 16px;
            border:1px solid var(--border-soft);
        }
        .log-details summary{
            cursor:pointer;
            user-select:none;
            color:var(--brand);
            outline:none;
            display:flex;
            align-items:center;
            font-weight:600;
            font-size:13px;
            letter-spacing:.3px;
            padding-bottom:8px;
            border-bottom:1px solid var(--border-soft);
        }
        .log-details[open] summary{margin-bottom:4px}
        .log-details summary:hover{color:var(--brand-deep)}
        .log-details summary::marker{color:#c2c9cf}
        .log-list{
            margin:8px 0 0 0;
            padding:0 0 0 20px;
            list-style:none;
            max-height:200px;
            overflow-y:auto;
            position:relative;
        }
        .log-list::before{
            content:"";
            position:absolute;
            left:7px;top:10px;bottom:10px;
            width:2px;
            background:linear-gradient(180deg, rgba(23,99,92,.25), rgba(61,139,110,.35));
            border-radius:1px;
        }
        .log-list::-webkit-scrollbar{width:6px}
        .log-list::-webkit-scrollbar-track{background:transparent;border-radius:3px}
        .log-list::-webkit-scrollbar-thumb{background:rgba(37,49,58,.12);border-radius:3px}
        .log-list::-webkit-scrollbar-thumb:hover{background:rgba(37,49,58,.22)}
        .log-list li{
            margin:0;
            padding:8px 10px;
            line-height:1.5;
            display:flex;
            align-items:center;
            position:relative;
            border-radius:8px;
            transition:background .2s ease;
            color:#4a5560;
        }
        .log-list li:hover{background:rgba(23,99,92,.04)}
        .log-list li::before{
            content:"";
            position:absolute;
            left:-17px;
            width:9px;height:9px;
            border-radius:50%;
            border:2px solid #d4ddd9;
            background:var(--surface);
            z-index:1;
        }
        .log-done{color:var(--ink)}
        .log-done::before{
            background:var(--green) !important;
            border-color:var(--green) !important;
            box-shadow:0 0 0 3px rgba(61,139,110,.12) !important;
        }
        .log-duration{
            margin-left:auto;
            font-size:11.5px;
            color:var(--brand);
            background:var(--brand-soft);
            border:1px solid rgba(23,99,92,.15);
            padding:2px 10px;
            border-radius:999px;
            white-space:nowrap;
            font-weight:600;
            letter-spacing:.3px;
            font-variant-numeric:tabular-nums;
            flex-shrink:0;
        }
        .log-running{
            color:var(--brand);
            animation:pulseText 2s infinite;
        }
        .log-running::before{
            background:var(--brand) !important;
            border-color:var(--brand) !important;
            box-shadow:0 0 0 3px rgba(23,99,92,.15) !important;
            animation:pulseNode 2s infinite !important;
        }
        @keyframes pulseText{
            0%,100%{opacity:1}
            50%{opacity:.65}
        }
        @keyframes pulseNode{
            0%,100%{box-shadow:0 0 0 3px rgba(23,99,92,.15)}
            50%{box-shadow:0 0 0 5px rgba(23,99,92,.08)}
        }
        .log-error{color:var(--red) !important}
        .log-error::before{
            background:var(--red) !important;
            border-color:var(--red) !important;
            box-shadow:0 0 0 3px rgba(192,86,75,.12) !important;
        }

        .empty-tip{
            text-align:center;
            color:#b4bac2;
            font-size:13px;
            margin-top:32px;
            letter-spacing:.5px;
            display:none;
        }

        @media (max-width: 640px){
            .topbar{padding:16px 16px 8px}
            .container{padding:10px 16px 36px}
            .upload-area{padding:36px 20px}
            .file-item{flex-direction:column;align-items:stretch}
            .status-badge{align-self:flex-start}
            .title span{display:none}
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand">
        <div class="logo">知微</div>
        <div class="title">
            <strong>知微</strong>
            <span>知微见著 · 问有所答</span>
        </div>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="chat.html">返回问答</a>
    </div>
</div>

<div class="container">
    <div class="upload-area" id="dropZone">
        <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </div>
        <div class="upload-text">点击或拖拽文件到此处上传</div>
        <div class="upload-sub">
            支持格式
            <span class="fmt">PDF</span>
            <span class="fmt">Markdown</span>
        </div>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
    </div>

    <div id="fileList" class="file-list"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
        // 重置以便重复选择同一文件
        e.target.value = '';
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = 'linear-gradient(90deg, #3d8b6e, #57a98a)';
        } else if (safePercentage < 10) {
            bar.style.background = 'linear-gradient(90deg, #b8862f, #d6a54a)';
        } else {
            bar.style.background = 'linear-gradient(90deg, #17635c, #2c857b)';
        }
    }

    async function uploadFile(file) {
        // === 核心逻辑优化：动态判断总节点数 ===
        const isPDF = file.name.toLowerCase().endsWith('.pdf');
        // PDF 需要 9 步（含上传），MD 跳过 pdf_to_md 需要 8 步
        const totalNodes = isPDF ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);

        try {
            progressWrapper.style.display = 'block';

            // 使用动态的 totalNodes 计算基础上传进度
            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');

            const result = await response.json();
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            // 把专属的 totalNodes 传给轮询函数
            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = "网络请求失败或服务器异常";
            errLog.className = "log-error";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    function formatDuration(seconds) {
        if (seconds < 60) {
            return seconds.toFixed(1) + 's';
        }
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    // 接收 totalNodes 参数计算最终百分比和渲染文案
    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        // === 进度计算逻辑 ===
        let currentPercentage = (done.length / totalNodes) * 100;

        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }

        // 计算总耗时
        let totalDuration = 0;
        for (const key in durationMap) {
            totalDuration += durationMap[key];
        }
        const totalDurationText = totalDuration > 0 ? ` · 总耗时 ${formatDuration(totalDuration)}` : '';

        // 更新日志文案
        logSummary.textContent = `运行日志（${done.length}/${totalNodes} 步完成${totalDurationText}）`;

        logListEl.innerHTML = '';

        for (const item of done) {
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${normalizeLogText(item)} 节点执行完成`;
            li.appendChild(nameSpan);

            // 添加耗时标签
            if (durationMap[item] !== undefined) {
                const durationSpan = document.createElement('span');
                durationSpan.className = 'log-duration';
                durationSpan.textContent = formatDuration(durationMap[item]);
                li.appendChild(durationSpan);
            }

            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;

            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                if (stopped) return;

                // 传入 totalNodes 继续计算
                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);

                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "工作流执行失败中止";
                    errLog.className = "log-error";
                    logListEl.appendChild(errLog);

                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>

</body>
</html>
