<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>知微 · 知识问答</title>
  <style>
    :root{
      --paper:#f7f5ef;
      --surface:#ffffff;
      --ink:#25313a;
      --muted:#8a939e;
      --brand:#17635c;
      --brand-deep:#0f4a45;
      --brand-soft:#e7f0ee;
      --seal:#c0564b;
      --border:#e6e1d6;
      --border-soft:#efebe2;
      --shadow:0 12px 32px -14px rgba(31, 45, 40, .18);
      --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
      --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      background-color:var(--paper);
      background-image:
        radial-gradient(ellipse 60% 30% at 50% -5%, rgba(23, 99, 92, .07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 25% at 95% 100%, rgba(192, 86, 75, .04) 0%, transparent 70%);
      color:var(--ink);
      display:flex;
      justify-content:center;
    }
    .app{
      width:100%;
      max-width:920px;
      height:100vh;
      height:100dvh;
      display:flex;
      flex-direction:column;
      background:transparent;
    }

    /* ============ 顶栏 ============ */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:18px 24px 14px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:42px;height:42px;border-radius:10px;
      background:linear-gradient(160deg, var(--brand), var(--brand-deep));
      color:#f2efe6;
      font-family:var(--serif);
      font-size:17px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      letter-spacing:1px;
      box-shadow:0 6px 16px -6px rgba(15, 74, 69, .45);
      position:relative;
      flex:0 0 auto;
    }
    .logo::after{
      content:"";
      position:absolute;right:-3px;bottom:-3px;
      width:10px;height:10px;border-radius:3px;
      background:var(--seal);
      border:2px solid var(--paper);
    }
    .title{display:flex;flex-direction:column;line-height:1.25}
    .title strong{font-size:19px;font-family:var(--serif);letter-spacing:2px;color:var(--ink)}
    .title span{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:1px}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .link-btn{
      font-size:13px;color:var(--brand);text-decoration:none;
      border:1px solid rgba(23,99,92,.25);background:var(--surface);
      padding:7px 14px;border-radius:8px;transition:all .2s;
    }
    .link-btn:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(23,99,92,.12)}
    .switch{
      display:flex;align-items:center;gap:6px;
      font-size:13px;color:var(--muted);cursor:pointer;user-select:none;
    }
    .switch input{accent-color:var(--brand);width:15px;height:15px;cursor:pointer}
    .btn{
      border:none;background:var(--surface);color:var(--muted);
      padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;
      border:1px solid var(--border);transition:all .2s;
    }
    .btn:hover{color:var(--seal);border-color:rgba(192,86,75,.4)}

    /* ============ 聊天区 ============ */
    .chat{
      flex:1;
      overflow-y:auto;
      padding:6px 24px 16px;
      display:flex;
      flex-direction:column;
    }
    .chat::-webkit-scrollbar{width:8px}
    .chat::-webkit-scrollbar-thumb{background:rgba(37,49,58,.12);border-radius:4px}
    .chat::-webkit-scrollbar-thumb:hover{background:rgba(37,49,58,.22)}
    .chat::-webkit-scrollbar-track{background:transparent}

    /* 欢迎页 */
    .welcome{
      margin:auto;
      text-align:center;
      max-width:520px;
      padding:20px;
    }
    .welcome .wm{
      width:64px;height:64px;border-radius:16px;margin:0 auto 20px;
      background:linear-gradient(160deg, var(--brand), var(--brand-deep));
      color:#f2efe6;font-family:var(--serif);font-size:26px;font-weight:700;
      display:flex;align-items:center;justify-content:center;letter-spacing:2px;
      box-shadow:0 10px 26px -10px rgba(15,74,69,.5);
    }
    .welcome h2{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:3px;margin:0 0 8px}
    .welcome p{color:var(--muted);font-size:14px;margin:0 0 26px;letter-spacing:1px}
    .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .chip{
      background:var(--surface);border:1px solid var(--border);
      padding:9px 16px;border-radius:999px;font-size:13px;color:var(--ink);
      cursor:pointer;transition:all .2s;text-align:left;
    }
    .chip:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 4px 12px rgba(23,99,92,.1);transform:translateY(-1px)}

    .dayline{
      text-align:center;color:var(--muted);font-size:12px;
      margin:6px 0 14px;letter-spacing:1px;
      display:flex;align-items:center;gap:14px;
    }
    .dayline::before,.dayline::after{
      content:"";flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .msg{display:flex;gap:12px;margin:14px 0;align-items:flex-end}
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}
    .avatar{
      width:36px;height:36px;border-radius:10px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;
    }
    .avatar.bot{
      background:linear-gradient(160deg, var(--brand), var(--brand-deep));
      color:#f2efe6;font-family:var(--serif);font-weight:700;letter-spacing:0;
      box-shadow:0 4px 10px -4px rgba(15,74,69,.4);
    }
    .avatar.me{
      background:var(--brand-soft);color:var(--brand);
      border:1px solid rgba(23,99,92,.15);font-weight:600;
    }
    .bubble{
      max-width:min(680px, 78%);
      display:inline-block;
      border-radius:14px 14px 14px 4px;
      padding:12px 16px;
      border:1px solid var(--border-soft);
      background:var(--surface);
      position:relative;
      line-height:1.7;
      font-size:14.5px;
      white-space:pre-wrap;
      overflow-wrap:break-word;
      color:var(--ink);
      box-shadow:0 2px 10px -4px rgba(31,45,40,.08);
    }
    .msg.user .bubble{
      background:linear-gradient(160deg, var(--brand), var(--brand-deep));
      color:#f4f2ea;
      border-color:transparent;
      border-radius:14px 14px 4px 14px;
      box-shadow:0 6px 16px -8px rgba(15,74,69,.4);
    }
    .meta{font-size:11px;color:var(--muted);margin-top:6px;padding:0 4px}
    .msg.user .meta{color:var(--muted)}

    /* 阶段进度 */
    details.progress{
      margin-top:10px;
      border:1px solid rgba(23,99,92,.18);
      border-radius:10px;
      padding:9px 12px;
      background:var(--brand-soft);
    }
    details.progress summary{
      cursor:pointer;user-select:none;
      color:var(--brand);font-size:12.5px;font-weight:600;letter-spacing:.5px;
    }
    details.progress summary:hover{color:var(--brand-deep)}
    .progress ul{margin:8px 0 0 4px;padding:0;list-style:none}
    .progress li{
      margin:5px 0;font-size:12.5px;color:#5a6b66;
      display:flex;align-items:center;gap:7px;
    }
    .progress li::first-letter{font-size:12.5px}

    /* 答案图片 */
    .answer-images{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .answer-images img{
      display:block;
      max-width:min(100%, 560px);
      max-height:560px;
      width:auto;height:auto;
      border-radius:10px;
      border:1px solid var(--border);
      box-shadow:0 8px 20px -8px rgba(31,45,40,.2);
      background:var(--paper);
    }
    .answer-images a{
      font-size:12px;color:var(--muted);
      text-decoration:none;word-break:break-all;
    }
    .answer-images a:hover{color:var(--brand);text-decoration:underline}

    /* 输入动画 */
    .typing{display:inline-flex;gap:5px;align-items:center;padding:2px 0}
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--brand);opacity:.7;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.4}
      40%{transform:translateY(-5px);opacity:1}
    }

    /* ============ 输入区 ============ */
    .composer-wrap{padding:6px 24px 18px}
    .composer{
      display:flex;gap:10px;align-items:flex-end;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:var(--shadow);
      transition:border-color .2s, box-shadow .2s;
    }
    .composer:focus-within{
      border-color:rgba(23,99,92,.45);
      box-shadow:0 0 0 3px rgba(23,99,92,.08), var(--shadow);
    }
    textarea{
      flex:1;resize:none;
      min-height:26px;max-height:150px;
      padding:6px 6px;
      border:none;outline:none;
      font-size:14.5px;line-height:1.6;
      font-family:var(--sans);
      background:transparent;color:var(--ink);
    }
    textarea::placeholder{color:#b4bac2}
    .send{
      width:46px;height:46px;flex:0 0 auto;
      border:none;border-radius:11px;cursor:pointer;
      color:#f2efe6;
      background:linear-gradient(160deg, var(--brand), var(--brand-deep));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 14px -6px rgba(15,74,69,.5);
      transition:transform .15s, opacity .2s;
    }
    .send:hover:not(:disabled){transform:translateY(-1px)}
    .send:active:not(:disabled){transform:translateY(0)}
    .send:disabled{opacity:.45;cursor:not-allowed}
    .send svg{width:19px;height:19px}
    .hint{
      text-align:center;color:#b0b6bd;
      font-size:12px;margin-top:10px;letter-spacing:.5px;
    }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      border:1px solid var(--border);
      padding:1px 6px;border-radius:5px;
      background:var(--paper);color:var(--muted);
      font-size:11px;
    }

    @media (max-width: 640px){
      .topbar{padding:14px 16px 10px}
      .chat{padding:6px 14px 12px}
      .composer-wrap{padding:6px 14px 14px}
      .bubble{max-width:88%}
      .title span{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">知微</div>
        <div class="title">
          <strong>知微</strong>
          <span>知微见著 · 问有所答</span>
        </div>
      </div>
      <div class="top-actions">
        <label class="switch" title="开启后回答将逐字流出展示">
          <input type="checkbox" id="streamToggle" checked> 流式
        </label>
        <a class="link-btn" href="import.html">文档导入</a>
        <button class="btn" id="btnClear">清空会话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="wm">知微</div>
        <h2>知微见著，问有所答</h2>
        <p>基于企业知识库的智能问答，随时向我提问</p>
        <div class="chips">
          <button class="chip" data-q="如何使用万用表测量电压？">如何使用万用表测量电压？</button>
          <button class="chip" data-q="LA2608 的接线方式是什么？">LA2608 的接线方式是什么？</button>
          <button class="chip" data-q="帮我总结知识库文档的要点">帮我总结知识库文档的要点</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="请输入问题…"></textarea>
        <button class="send" id="send" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>
          </svg>
        </button>
      </div>
      <div class="hint"><span class="kbd">Enter</span> 发送 · <span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
    </div>
  </div>

  <script>
    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');
    const welcomeEl = document.getElementById('welcome');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function hideWelcome(){
      if(welcomeEl) welcomeEl.remove();
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];

      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取，取并集防止漏图
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else if(images.length === 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      hideWelcome();
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar me">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar me">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">微</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      hideWelcome();
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">微</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>检索进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `检索进度（已完成 ${totalDone} · 进行中 ${totalRun} · ${displayStatus}）`;

      ul.innerHTML = '';
      if(done.length === 0 && running.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>等待任务开始…</li>');
      }else{
        for(const x of done){
          ul.insertAdjacentHTML('beforeend', `<li>✅ ${escapeHtml(x)}</li>`);
        }
        for(const x of running){
          ul.insertAdjacentHTML('beforeend', `<li>⏳ ${escapeHtml(x)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      if(err){
        answerEl.textContent = `抱歉，本次处理失败：\n${err}`;
      }else{
        renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      }
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        hideWelcome();
        // 清空欢迎页后渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(const n of nodes) n.remove();
        const line = chatEl.querySelector('.dayline');
        if(!line) chatEl.insertAdjacentHTML('afterbegin', '<div class="dayline">历史会话</div>');
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      autoResize(inputEl);
      hideWelcome();
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);

        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { task_id } = data;

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${task_id}`);
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        // ★ 收到 final/final_answer 时，强制刷新进度 + 渲染答案
        function handleFinalEvent(e) {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();

          // ★ 关键修复：强制把所有"进行中 ⏳"的节点标记为"已完成 ✅"
          // 原因：最后一条 progress 事件可能还没到就被 final 抢先了，
          // 导致"生成答案"等节点永远卡在 ⏳ 状态不变绿
          const details = botMsgEl.querySelector('details.progress');
          if(details){
            const ul = details.querySelector('ul');
            if(ul){
              const lis = ul.querySelectorAll('li');
              lis.forEach(li => {
                if(li.textContent.includes('⏳')){
                  li.textContent = li.textContent.replace('⏳', '✅');
                }
              });
            }
            const summary = details.querySelector('summary');
            if(summary){
              const totalDone = details.querySelectorAll('li').length;
              summary.textContent = `检索进度（已完成 ${totalDone} · 进行中 0 · 已完成）`;
            }
            // 收起进度条
            details.removeAttribute('open');
          }

          try{
            const d = JSON.parse(e.data || '{}');
            // 优先使用 final 包里的完整 answer，否则回退到流式拼接的文本
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        }

        es.addEventListener('final', handleFinalEvent);
        es.addEventListener('final_answer', handleFinalEvent);

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + (progress ? progress.outerHTML : '');
        sendBtn.disabled = false;
      }
    }

    // 输入框高度自适应
    function autoResize(el){
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }
    inputEl.addEventListener('input', () => autoResize(inputEl));

    // 快捷提问标签
    chatEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      inputEl.value = chip.dataset.q || chip.textContent;
      autoResize(inputEl);
      inputEl.focus();
    });

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空对话并恢复欢迎页
      chatEl.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="wm">知微</div>
          <h2>知微见著，问有所答</h2>
          <p>基于企业知识库的智能问答，随时向我提问</p>
          <div class="chips">
            <button class="chip" data-q="如何使用万用表测量电压？">如何使用万用表测量电压？</button>
            <button class="chip" data-q="LA2608 的接线方式是什么？">LA2608 的接线方式是什么？</button>
            <button class="chip" data-q="帮我总结知识库文档的要点">帮我总结知识库文档的要点</button>
          </div>
        </div>
      `;
      // 重新绑定引用
      const newWelcome = document.getElementById('welcome');
      if(newWelcome) newWelcome.scrollIntoView();
    });

    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
